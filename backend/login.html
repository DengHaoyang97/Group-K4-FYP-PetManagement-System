<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Management System - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
colors: {
primary: '#10B981',
secondary: '#86EFAC'
},
borderRadius: {
'none': '0px',
'sm': '2px',
DEFAULT: '4px',
'md': '8px',
'lg': '12px',
'xl': '16px',
'2xl': '20px',
'3xl': '24px',
'full': '9999px',
'button': '4px'
}
}
}
}
</script>
<style>
body {
min-height: 1024px;
background-image: url('https://ai-public.mastergo.com/ai/img_res/96b78eee1616694a3f2cc14cd23b0fb3.jpg');
background-size: cover;
background-position: center;
}
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
-webkit-appearance: none;
margin: 0;
}
</style>
</head>
<body class="flex items-center justify-center bg-gray-50">
<div class="w-[420px] bg-white p-10 rounded-lg shadow-xl">
<div class="text-center mb-8">
<h1 class="font-['Pacifico'] text-3xl text-primary mb-2">logo</h1>
<p class="text-gray-600">Pet Management System</p>
</div>
<form id="loginForm" class="space-y-6">
<div>
<label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
<div class="relative">
<i class="fas fa-user absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 flex justify-center items-center w-4 h-4"></i>
<input type="text" id="username" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-button focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" placeholder="Enter admin username">
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
<div class="relative">
<i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 flex justify-center items-center w-4 h-4"></i>
<input type="password" id="password" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-button focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" placeholder="Enter password">
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center">
<input type="checkbox" class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
<span class="ml-2 text-sm text-gray-600">Remember me</span>
</label>
<a href="#" class="text-sm text-primary hover:text-primary/80">Forgot password?</a>
</div>
<button type="submit" class="w-full bg-primary text-white py-2 px-4 !rounded-button hover:bg-primary/90 transition-colors duration-200 whitespace-nowrap">
Login
</button>
</form>
<div class="mt-6 text-center text-sm text-gray-500">
Having trouble? Please contact system administrator
</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
e.preventDefault();
const username = document.getElementById('username').value;
const password = document.getElementById('password').value;
if(username === 'admin' && password === '123') {
window.location.href = 'index.html';
} else {
alert('Invalid username or password, please try again!');
}
});
</script>
</body>
</html>
